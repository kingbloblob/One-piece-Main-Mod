const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let view="fruits", typeF="All";
try{const h=location.hash.slice(1); if(["fruits","characters","weapons","rules"].includes(h)) view=h;}catch(e){}
document.getElementById("stats").innerHTML=`<span><b>${D.fruits.length}</b> fruits</span><span><b>${D.characters.length}</b> characters</span><span><b>${D.weapons.length}</b> weapons</span>`;
document.getElementById("notes").textContent=D.notes;
const row=(k,v)=>v?`<div class="row"><span class="k">${k}</span>${esc(v)}</div>`:"";
const mc=v=>`<div class="mc"><span class="k row" style="display:block;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em">In Minecraft</span>${esc(v)}</div>`;
function fruitCard(f){return `<article class="card"><h3>${esc(f.name)}</h3><div class="en">${esc(f.english)}</div>
<div class="tags"><span class="tag t-${f.type}">${f.type}</span>${f.subtype?`<span class="tag">${esc(f.subtype)}</span>`:""}</div>
${row("User",f.user)}${row("Power",f.power)}${mc(f.minecraft)}</article>`}
function charCard(c){return `<article class="card"><h3>${esc(c.name)}</h3><div class="en">${esc(c.role)}</div>
<div class="tags"><span class="tag">${esc(c.affiliation)}</span></div>
${row("Devil Fruit",c.fruit)}<div class="row"><span class="k">Haki</span><div class="haki">${c.haki.length?c.haki.map(h=>`<span class="h">${h}</span>`).join(""):'<span style="color:var(--muted)">None shown</span>'}</div></div>
${row("Fighting style",c.style)}${row("Weapons",c.weapons)}</article>`}
function weapCard(w){return `<article class="card"><h3>${esc(w.name)}</h3><div class="en">${esc(w.kind)}</div>
<div class="tags"><span class="tag">${esc(w.grade)}</span></div>${row("Owner",w.owner)}${row("About",w.note)}${mc(w.minecraft)}</article>`}
function ruleCard(r){return `<article class="card"><h3>${esc(r.rule||r.name)}</h3>${row("In the story",r.lore)}${mc(r.minecraft)}</article>`}
function match(o,q){return !q||JSON.stringify(o).toLowerCase().includes(q)}
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===view));
  const q=document.getElementById("q").value.trim().toLowerCase();
  const fl=document.getElementById("filters"), out=document.getElementById("out"), ct=document.getElementById("count");
  fl.innerHTML=""; fl.hidden=view!=="fruits";
  let html="", n=0, total=0;
  if(view==="fruits"){
    fl.innerHTML=["All","Paramecia","Zoan","Logia"].map(t=>`<button class="chipbtn" aria-pressed="${t===typeF}" data-t="${t}">${t}${t==="All"?"":" · "+D.fruits.filter(f=>f.type===t).length}</button>`).join("");
    const L=D.fruits.filter(f=>(typeF==="All"||f.type===typeF)&&match(f,q)); n=L.length; total=D.fruits.length;
    html=`<div class="grid">${L.map(fruitCard).join("")}</div>`;
  } else if(view==="characters"){const L=D.characters.filter(c=>match(c,q)); n=L.length; total=D.characters.length; html=`<div class="grid">${L.map(charCard).join("")}</div>`;}
  else if(view==="weapons"){const L=D.weapons.filter(w=>match(w,q)); n=L.length; total=D.weapons.length;
    html=`<p class="row" style="max-width:70ch;color:var(--muted);margin:0 0 12px">Named swords (meito) are ranked in four grades: 12 Supreme Grade, 21 Great Grade, 50 Skillful Grade, and many more at Grade. That maps well to tool tiers in Minecraft.</p><div class="grid">${L.map(weapCard).join("")}</div>`;}
  else {const R=D.rules.filter(r=>match(r,q)), H=D.haki.filter(h=>match(h,q)); n=R.length+H.length; total=D.rules.length+D.haki.length;
    html=`<section><h2>How Devil Fruits work</h2><div class="grid">${R.map(ruleCard).join("")}</div></section><section><h2>The three Haki</h2><div class="grid">${H.map(ruleCard).join("")}</div></section>`;}
  ct.textContent=`Showing ${n} of ${total}`;
  out.innerHTML=n?html:`<p class="empty">Nothing matches "${esc(q)}". Try a shorter word.</p>`;
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab"); if(!b)return; view=b.dataset.v; try{history.replaceState(null,"","#"+view)}catch(e){} render();});
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest(".chipbtn"); if(!b)return; typeF=b.dataset.t; render();});
document.getElementById("q").addEventListener("input",render);
render();
</script>
